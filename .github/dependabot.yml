# Wer sagt Bescheid, wenn draussen etwas Neues erscheint.
#
# Der type-detector ist der Grund fuer diese Datei. Er ist eine
# Bibliothek von npmjs.com, keine Beigabe von ioBroker, und er wird beim
# Bauen fest in admin/detector.js eingebacken. Ohne Nachricht von aussen
# erfaehrt niemand, dass es eine neue Fassung gibt - und mit ihr
# vielleicht neue Geraetemuster, die die Werkbank dann nicht kennt.
#
# Dependabot schaut woechentlich nach und macht einen Pull Request auf.
# Der Test „Der eingebackene Detektor" faellt dann rot aus, solange
# `npm run build` nicht gelaufen ist - so kann man das Einbacken nicht
# vergessen (08.09.2026, nachdem genau das passiert war: installiert
# 6.0.1, ausgeliefert weiter 6.0.0).

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'npm'
    # Abkuehlzeit gegen Lieferketten-Angriffe: Ein Paket, das heute
    # veroeffentlicht wird, wird erst in einer Woche vorgeschlagen. Wird
    # eine kompromittierte Fassung in dieser Zeit zurueckgezogen, kommt
    # sie hier nie an. Der Repochecker verlangt mindestens sieben Tage
    # (E8915, 11.09.2026).
    cooldown:
      default-days: 7
    ignore:
      # @types/node muss zur Node-Fassung passen, unter der der Adapter
      # laeuft (engines.node >= 20). Ein Sprung auf die naechste
      # Hauptversion wuerde Typen von einer Laufzeit beschreiben, die
      # hier gar nicht im Einsatz ist (E8917).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Werkzeug, das nur beim Entwickeln laeuft, sammelt sich in einem
      # Vorgang - eslint und mocha einzeln durchzuwinken bringt nichts.
      werkzeug:
        patterns:
          - '@iobroker/eslint-config'
          - '@iobroker/testing'
          - 'esbuild'
    # Der Detektor bleibt bewusst ausserhalb der Gruppe: seine
    # Aktualisierung ist die einzige, die ausgeliefert wird und die
    # Erkennung veraendert. Sie gehoert einzeln angesehen.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'

name: Test and Release

# Auf jeden Push und Pull Request - und auf Tags mit einer Versionsnummer,
# die dann veroeffentlicht werden.
on:
  push:
    branches:
      - "main"
    tags:
      # normale Versionen
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Vorabversionen
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Ein neuer Push auf denselben Zweig loest den vorigen Lauf ab.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Die schnellen Pruefungen zuerst, bevor die teuren Laeufe starten.
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v1
        with:
          node-version: '22.x'
          lint: true

  # Die Werkbank hat keinen laufenden Prozess (mode: none), es gibt also
  # nichts zu starten und zu beobachten. Geprueft wird stattdessen, was
  # bisher von Hand lief: Buendelprobe, Uebersetzungen, Vorlagen.
  vorpruefung:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Die untere Grenze steht in package.json (engines.node >= 20).
        node-version: [20.x, 22.x, 24.x]
        os: [ubuntu-latest]
        include:
          # Entwickelt wird unter Windows - einmal muss es auch dort laufen.
          - node-version: 22.x
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Der Detektor laesst sich buendeln
        # Geprueft wird, dass der Bau durchlaeuft - nicht, dass er das
        # eingecheckte admin/detector.js Byte fuer Byte trifft. Das tut
        # er derzeit naemlich nicht: die eingecheckte Fassung stammt vom
        # 19.08.2026 und ist 131 Zeichen laenger als ein Bau von heute,
        # bei unveraendertem src/ und type-detector 6.0.0. Ausgeliefert
        # wird bewusst die gepruefte Fassung.
        run: npm run build
      - name: Der gepruefen Fassung nicht in die Quere kommen
        run: git checkout -- admin/detector.js
      - run: npm test

  # Veroeffentlicht wird nur, wenn ein Commit mit einer Version getaggt ist.
  deploy:
    needs: [check-and-lint, vorpruefung]

    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Schreibrechte, damit ein GitHub-Release angelegt werden kann.
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          # Ohne diese Zeile laeuft der Job durch, veroeffentlicht aber
          # nichts: das Token liegt als Secret im Repository und muss
          # hier ausdruecklich uebergeben werden.
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
